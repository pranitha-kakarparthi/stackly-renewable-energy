<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Circuit Disconnected | Stackly Renewable Energy</title>
  <meta name="description" content="The requested clean energy page could not be found. Return to Stackly Renewable Energy homepage.">
  <link rel="icon" type="image/webp" href="../assets/images/logoStackly.webp">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <style>
    /* Fixed 404 Fullscreen Layout */
    html, body {
      height: 100%;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #F4F7F6;
    }
    .page-fixed-404 {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card-404-fixed {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: 0 25px 60px -12px rgba(15, 42, 55, 0.18), 0 10px 24px rgba(0, 0, 0, 0.04);
      padding: clamp(2rem, 5vw, 3.5rem);
      max-width: 640px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 3;
    }
    .error-number-fixed {
      font-size: clamp(5.5rem, 14vw, 8.5rem);
      font-weight: 900;
      line-height: 0.95;
      background: linear-gradient(135deg, #00D2D3 0%, #2ECC71 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0.5rem 0 1rem 0;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <!-- Cinematic Ambient Background Video Animation -->
  <div class="hero-video-ambient-wrap" aria-hidden="true" style="position: fixed; inset: 0; z-index: 0;">
    <video class="hero-bg-video" autoplay muted loop playsinline preload="auto">
      <source src="../assets/videos/hero-404.mp4" type="video/mp4">
    </video>
    <div class="hero-video-overlay" style="background: radial-gradient(circle at center, rgba(252, 242, 229, 0.75) 0%, rgba(255, 206, 216, 0.92) 100%);"></div>
  </div>

  <main id="mainContent" class="page-fixed-404" role="main">
    <div class="card-404-fixed tilt-card">
      <!-- Stackly Brand Logo Header Link to Homepage -->
      <a href="../index.html" class="brand-logo-link" aria-label="Stackly Renewable Energy Homepage" style="display: inline-block; margin-bottom: 1.5rem;">
        <img src="../assets/images/logoStackly-dark.webp" alt="Stackly Renewable Energy" class="brand-logo-img" width="160" height="54">
      </a>

      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0.5rem;">
        <span class="badge-tag badge-accent" style="margin: 0;">⚡ Transmission Line Offline</span>
      </div>

      <div class="error-number-fixed" aria-label="Error 404">404</div>

      <h1 style="font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 0.85rem; color: var(--color-secondary); font-weight: 800;">
        Circuit Disconnected • Page Not Found
      </h1>

      <p style="font-size: 0.98rem; color: var(--text-muted); line-height: 1.6; margin: 0 auto 2rem auto; max-width: 480px;">
        The clean energy telemetry route you requested is unavailable or undergoing grid synchronization. Return to the main power network to continue.
      </p>

      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="../index.html" class="btn btn-primary" style="padding: 12px 28px; font-weight: 700;">
          Return to Homepage
          <span class="btn-icon-capsule" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
        </a>
        <button type="button" onclick="history.back()" class="btn btn-secondary" style="padding: 12px 24px;">
          ← Go Back
        </button>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
